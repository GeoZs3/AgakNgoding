<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Tanaman</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="parchment-container">
        <div class="parchment-paper">
            
            <div class="parchment-header">
                <div class="parchment-title-area">
                    <h1>{{ buku['nama_tanaman'] }}</h1>
                    <p>No. Registrasi: {{ buku['id'] }}</p>
                </div>
                <img src="https://via.placeholder.com/240x180/388e3c/fff?text={{ buku['nama_tanaman'] }}" alt="Ilustrasi" class="parchment-image">
            </div>

            <div class="parchment-content">
                <p><strong>Lokasi Penanaman:</strong> {{ buku['lokasi'] }}</p>
                <p><strong>Total Jumlah:</strong> {{ buku['jumlah'] }} buah</p>
                <p><strong>Kondisi Saat Ini:</strong> {{ buku['status'] }}</p>
                
                {% if buku['qr'] %}
                <p><strong>Kode QR:</strong> {{ buku['qr'] }}</p>
                {% endif %}
                
                <br>
                <a href="{{ url_for('index') }}" class="btn-back">&#8592; Kembali ke Pohon</a>
            </div>

        </div>
    </div>

</body>
</html>
